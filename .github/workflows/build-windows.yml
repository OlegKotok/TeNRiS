name: Build TeNRiS II for Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Free Pascal
      run: |
        Invoke-WebRequest -Uri "https://sourceforge.net/projects/freepascal/files/Win32/3.2.2/fpc-3.2.2.i386-win32.exe/download" -OutFile "fpc-installer.exe"
        Start-Process -FilePath "fpc-installer.exe" -ArgumentList "/SILENT" -Wait
        
    - name: Add FPC to PATH
      run: echo "C:\FPC\3.2.2\bin\i386-Win32" >> $env:GITHUB_PATH
      
    - name: Verify FPC installation
      run: fpc -h
      
    - name: Build TeNRiS II
      run: |
        fpc -Mdelphi -Twin32 -O2 -WG -Fu. -FE"dist" -FU"build" TeNRiS.lpr
        
    - name: Copy game assets
      run: |
        New-Item -ItemType Directory -Force -Path "dist"
        Copy-Item "DGLEngine.dll" "dist\"
        Copy-Item "*.dat" "dist\" -ErrorAction SilentlyContinue
        Copy-Item "*.ini" "dist\" -ErrorAction SilentlyContinue
        Copy-Item "*.ico" "dist\" -ErrorAction SilentlyContinue
        Copy-Item "*.txt" "dist\" -ErrorAction SilentlyContinue
        if (Test-Path "sounds") { Copy-Item "sounds" "dist\" -Recurse }
        if (Test-Path "texture") { Copy-Item "texture" "dist\" -Recurse }
        if (Test-Path "girls") { Copy-Item "girls" "dist\" -Recurse }
        
    - name: Create release package
      run: |
        Compress-Archive -Path "dist\*" -DestinationPath "TeNRiS-II-Windows.zip"
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TeNRiS-II-Windows
        path: TeNRiS-II-Windows.zip
        
    - name: Upload to release
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./TeNRiS-II-Windows.zip
        asset_name: TeNRiS-II-Windows.zip
        asset_content_type: application/zip
