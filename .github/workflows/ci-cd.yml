name: Package Game

on:
  push:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Package TeNRiS II
      run: |
        mkdir release
        cp TeNRiS.dpr release/
        cp DGLEngine_header.pas release/
        cp DGLEngine.dll release/
        cp *.dat release/ 2>/dev/null || true
        cp *.ini release/ 2>/dev/null || true
        cp readme.txt release/ 2>/dev/null || true
        cp -r sounds release/ 2>/dev/null || true
        cp -r texture release/ 2>/dev/null || true
        cp -r girls release/ 2>/dev/null || true
        
        # Create build instructions
        cat > release/BUILD.md << 'EOF'
        # How to Build TeNRiS II
        
        ## Requirements
        - Free Pascal Compiler or Delphi
        - Windows (for DGLEngine.dll)
        
        ## Build Commands
        ```bash
        # With Free Pascal
        fpc -Mdelphi -Twin32 -O3 -WG TeNRiS.dpr
        
        # With Delphi
        dcc32 TeNRiS.dpr
        ```
        
        ## Run
        ```bash
        TeNRiS.exe
        ```
        EOF
        
    - name: Create release package
      run: |
        cd release
        zip -r ../TeNRiS-II-Source-$(date +%Y%m%d).zip .
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: TeNRiS-II-Source
        path: TeNRiS-II-Source-*.zip
