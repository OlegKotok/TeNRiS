name: Build Game

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Free Pascal
      run: choco install freepascal -y
      
    - name: Create OpenGL stub
      run: |
        @"
        unit OpenGL;
        interface
        type GLFloat = Single;
        implementation
        end.
        "@ | Out-File -FilePath "OpenGL.pas" -Encoding UTF8
        
    - name: Fix source files
      run: |
        # Replace Graphics with our SimpleGraphics
        (Get-Content TeNRiS.dpr) -replace 'Graphics,', 'SimpleGraphics,' | Set-Content TeNRiS.dpr
        
        # Fix DGLEngine header
        (Get-Content DGLEngine_header.pas) -replace 'uses Windows, Tlhelp32, Classes, SysUtils, Graphics, OpenGl;', 'uses Windows, Classes, SysUtils, SimpleGraphics, OpenGL;' | Set-Content DGLEngine_header.pas
        
    - name: Build TeNRiS II
      run: |
        $env:PATH += ";C:\tools\freepascal\bin\i386-win32"
        fpc -Mdelphi -Twin32 -O3 -WG -Fu. TeNRiS.dpr
        
    - name: Package game
      run: |
        mkdir game
        copy TeNRiS.exe game\
        copy DGLEngine.dll game\
        xcopy sounds game\sounds\ /E /I
        xcopy texture game\texture\ /E /I  
        xcopy girls game\girls\ /E /I
        copy *.dat game\
        copy *.ini game\
        
    - name: Create ZIP
      run: |
        Compress-Archive -Path game\* -DestinationPath TeNRiS-II.zip
        
    - name: Upload Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: TeNRiS II v${{ github.run_number }}
        files: TeNRiS-II.zip
        body: |
          **TeNRiS II - Working Game**
          
          Built with custom Graphics replacement
          Extract ZIP and run TeNRiS.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
