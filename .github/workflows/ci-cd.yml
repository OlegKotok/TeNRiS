name: Build Game

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Lazarus
      run: choco install lazarus -y
      
    - name: Build TeNRiS II
      run: |
        $env:PATH += ";C:\lazarus\fpc\3.2.2\bin\i386-win32"
        fpc -Mdelphi -Twin32 -O3 -WG -Fu"C:\lazarus\lcl\units\i386-win32" -Fu"C:\lazarus\lcl\units\i386-win32\win32" TeNRiS.dpr
        
    - name: Package game
      run: |
        mkdir game
        copy TeNRiS.exe game\
        copy DGLEngine.dll game\
        xcopy sounds game\sounds\ /E /I
        xcopy texture game\texture\ /E /I  
        xcopy girls game\girls\ /E /I
        copy *.dat game\
        copy *.ini game\
        copy readme.txt game\
        
    - name: Create ZIP
      run: |
        Compress-Archive -Path game\* -DestinationPath TeNRiS-II.zip
        
    - name: Upload Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: TeNRiS II v${{ github.run_number }}
        files: TeNRiS-II.zip
        body: |
          **TeNRiS II - Working Game**
          
          Extract ZIP and run TeNRiS.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
