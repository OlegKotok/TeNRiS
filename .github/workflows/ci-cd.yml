name: Build and Release

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-pascal:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup FPC i386 + LCL
        run: |
          # Install FPC i386-win32
          $fpcUrl = "https://sourceforge.net/projects/freepascal/files/Win32/3.2.2/fpc-3.2.2.i386-win32.exe/download"
          Invoke-WebRequest -Uri $fpcUrl -OutFile fpc-setup.exe
          Start-Process -Wait -FilePath fpc-setup.exe -ArgumentList "/VERYSILENT /DIR=C:\fpc32"
          $env:PATH = "C:\fpc32\bin\i386-win32;$env:PATH"

          # Download Lazarus zip for LCL i386 units only
          $lazUrl = "https://sourceforge.net/projects/lazarus/files/Lazarus%20Windows%2032%20bits/Lazarus%203.6/lazarus-3.6-fpc-3.2.2-win32.exe/download"
          Invoke-WebRequest -Uri $lazUrl -OutFile laz-setup.exe
          Start-Process -Wait -FilePath laz-setup.exe -ArgumentList "/VERYSILENT /DIR=C:\lazarus32"
      - name: Build TeNRiS II
        run: |
          $env:PATH = "C:\fpc32\bin\i386-win32;$env:PATH"
          $graphicsPPU = Get-ChildItem -Path "C:\lazarus32" -Filter "graphics.ppu" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like "*i386*" } | Select-Object -First 1
          if (-not $graphicsPPU) { Write-Error "LCL i386 Graphics unit not found"; exit 1 }
          $lclDir = $graphicsPPU.Directory.FullName
          Write-Host "LCL i386 units at: $lclDir"
          mkdir -Force build; mkdir -Force build/units
          fpc -Mdelphi -Twin32 -O3 -WG -FE"build" -FU"build/units" -Fu"$lclDir" TeNRiS.dpr
      - name: Package game
        run: |
          copy *.dll build\ 2>$null
          copy *.dat build\ 2>$null
          copy *.ini build\ 2>$null
          copy readme.txt build\ 2>$null
          if (Test-Path sounds) { xcopy sounds build\sounds\ /E /I }
          if (Test-Path texture) { xcopy texture build\texture\ /E /I }
      - name: Create release package
        run: |
          $timestamp = Get-Date -Format "yyyy-MM-dd-HHmm"
          $filename = "TeNRiS-II-Pascal-$timestamp.zip"
          Compress-Archive -Path "build\*" -DestinationPath $filename
          echo "RELEASE_FILE=$filename" >> $env:GITHUB_ENV
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeNRiS-II-Pascal
          path: ${{ env.RELEASE_FILE }}

  build-python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14-dev"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame-ce pyinstaller Pillow
      - name: Build Standalone EXE
        run: |
          python create_installer.py
      - name: Prepare EXE for upload
        run: |
          $file_name = "TeNRiS-II.exe"
          Move-Item -Path "dist\TeNRiS.exe" -Destination "dist\$file_name"
          echo "EXE_NAME=$file_name" >> $env:GITHUB_ENV
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeNRiS-II-Windows-Python14-Release
          path: dist\${{ env.EXE_NAME }}

  release:
    needs: [build-pascal, build-python]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Download Pascal Artifact
        uses: actions/download-artifact@v4
        with:
          name: TeNRiS-II-Pascal
      - name: Download Python Artifact
        uses: actions/download-artifact@v4
        with:
          name: TeNRiS-II-Windows-Python14-Release
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: TeNRiS II Build ${{ github.run_number }}
          files: |
            TeNRiS-II-Pascal-*.zip
            *.exe
          body: |
            **TeNRiS II Automated Release**

            **Downloads:**
            - **`.exe` file:** Modern Pygame-ce port (Standalone, Python 3.14).
            - **`.zip` file:** Classic Pascal OpenGL version.

            **Controls:**
            - Arrow keys: Move
            - Up: Rotate
            - Space: Mega-drop
            - R: Restart, S: Toggle music
            - Esc: Quit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
