name: Build Game

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Lazarus
      run: choco install lazarus -y
      
    - name: Fix DGLEngine header for Windows
      run: |
        # Remove Tlhelp32 dependency and add missing types
        (Get-Content DGLEngine_header.pas) -replace 'uses Windows, Tlhelp32, Classes, SysUtils, Graphics, OpenGl;', 'uses Windows, Classes, SysUtils, Graphics;' | Set-Content DGLEngine_header.pas
        
        # Add missing types after interface
        $content = Get-Content DGLEngine_header.pas -Raw
        $content = $content -replace 'interface', @"
interface

type
  TProcessEntry32 = record
    dwSize: DWORD;
    cntUsage: DWORD;
    th32ProcessID: DWORD;
    th32DefaultHeapID: ULONG_PTR;
    th32ModuleID: DWORD;
    cntThreads: DWORD;
    th32ParentProcessID: DWORD;
    pcPriClassBase: LONG;
    dwFlags: DWORD;
    szExeFile: array[0..259] of CHAR;
  end;

const
  TH32CS_SNAPPROCESS = $00000002;

function CreateToolhelp32Snapshot(dwFlags, th32ProcessID: DWORD): THandle; stdcall; external 'kernel32.dll';
function Process32First(hSnapshot: THandle; var lppe: TProcessEntry32): BOOL; stdcall; external 'kernel32.dll';
function Process32Next(hSnapshot: THandle; var lppe: TProcessEntry32): BOOL; stdcall; external 'kernel32.dll';
"@
        $content | Set-Content DGLEngine_header.pas
        
    - name: Build TeNRiS II
      run: |
        $env:PATH += ";C:\lazarus"
        lazbuild --build-mode=Release TeNRiS.lpi
        
    - name: Package game
      run: |
        mkdir game
        copy TeNRiS.exe game\
        copy DGLEngine.dll game\
        xcopy sounds game\sounds\ /E /I
        xcopy texture game\texture\ /E /I  
        xcopy girls game\girls\ /E /I
        copy *.dat game\
        copy *.ini game\
        copy readme.txt game\
        
    - name: Create ZIP
      run: |
        Compress-Archive -Path game\* -DestinationPath TeNRiS-II.zip
        
    - name: Upload Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: TeNRiS II v${{ github.run_number }}
        files: TeNRiS-II.zip
        body: |
          **TeNRiS II - Working Game**
          
          Extract ZIP and run TeNRiS.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
