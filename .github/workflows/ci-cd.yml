name: Build Game

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Lazarus
      run: choco install lazarus -y
      
    - name: Fix DGLEngine header for 32-bit
      run: |
        # Only remove Tlhelp32, keep OpenGL for the engine
        (Get-Content DGLEngine_header.pas) -replace 'uses Windows, Tlhelp32, Classes, SysUtils, Graphics, OpenGl;', 'uses Windows, Classes, SysUtils, Graphics, OpenGL;' | Set-Content DGLEngine_header.pas
        
    - name: Build TeNRiS II (32-bit for DGLEngine.dll)
      run: |
        $env:PATH += ";C:\lazarus"
        # Force 32-bit compilation for compatibility with DGLEngine.dll
        lazbuild --cpu=i386 --os=win32 --build-mode=Release TeNRiS.lpi
        
    - name: Package game
      run: |
        mkdir game
        copy TeNRiS.exe game\
        copy DGLEngine.dll game\
        xcopy sounds game\sounds\ /E /I
        xcopy texture game\texture\ /E /I  
        xcopy girls game\girls\ /E /I
        copy *.dat game\
        copy *.ini game\
        copy readme.txt game\
        
    - name: Create ZIP
      run: |
        Compress-Archive -Path game\* -DestinationPath TeNRiS-II.zip
        
    - name: Upload Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: TeNRiS II v${{ github.run_number }}
        files: TeNRiS-II.zip
        body: |
          **TeNRiS II - Working Game**
          
          32-bit OpenGL game with DGLEngine
          Extract ZIP and run TeNRiS.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
