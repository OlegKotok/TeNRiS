name: Build and Release

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Free Pascal
      run: |
        choco install freepascal --version=3.2.2 -y
        
    - name: Remove Graphics dependency
      run: |
        # Create version without Graphics unit
        (Get-Content TeNRiS.lpr) -replace 'Classes, Graphics,', 'Classes,' | Set-Content TeNRiS_Build.lpr
        # Replace TBitmap usage with direct file loading
        (Get-Content TeNRiS_Build.lpr) -replace 'bmp1:=TBitmap\.Create;.*?bmp2\.Free;', 'logo:=LoadTextureFromFile(GetCurrentDir+''\texture\logo.bmp'');' -replace '(?s)bmp1.*?bmp2\.Free;', 'logo:=LoadTextureFromFile(GetCurrentDir+''\texture\logo.bmp'');' | Set-Content TeNRiS_Build.lpr
        
    - name: Build TeNRiS II
      run: |
        $env:PATH = "C:\tools\freepascal\bin\i386-win32;" + $env:PATH
        New-Item -ItemType Directory -Force -Path "build"
        New-Item -ItemType Directory -Force -Path "build\units"
        fpc -Mdelphi -Twin32 -O3 -WG -FE"build" -FU"build\units" TeNRiS_Build.lpr
        Rename-Item "build\TeNRiS_Build.exe" "TeNRiS.exe"
        
    - name: Package game
      run: |
        Copy-Item "DGLEngine.dll" "build\" -ErrorAction SilentlyContinue
        Copy-Item "*.dat" "build\" -ErrorAction SilentlyContinue
        Copy-Item "*.ini" "build\" -ErrorAction SilentlyContinue
        Copy-Item "readme.txt" "build\" -ErrorAction SilentlyContinue
        if (Test-Path "sounds") { Copy-Item "sounds" "build\" -Recurse }
        if (Test-Path "texture") { Copy-Item "texture" "build\" -Recurse }
        if (Test-Path "girls") { Copy-Item "girls" "build\" -Recurse }
        
    - name: Create release package
      run: |
        $timestamp = Get-Date -Format "yyyy-MM-dd-HHmm"
        $branch = "${{ github.ref_name }}"
        $filename = "TeNRiS-II-$branch-$timestamp.zip"
        Compress-Archive -Path "build\*" -DestinationPath $filename
        echo "RELEASE_FILE=$filename" >> $env:GITHUB_ENV
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: TeNRiS-II-${{ github.ref_name }}
        path: ${{ env.RELEASE_FILE }}
        
    - name: Create Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: build-${{ github.run_number }}-${{ github.ref_name }}
        name: TeNRiS II Build ${{ github.run_number }} (${{ github.ref_name }})
        files: ${{ env.RELEASE_FILE }}
        body: |
          **Automatic build from branch:** `${{ github.ref_name }}`
          **Commit:** ${{ github.sha }}
          **Build:** #${{ github.run_number }}
          
          **Game:** Tetris with Numbers - OpenGL version with 3D sound
          **System Requirements:** Windows 7+, DirectX 9.0c
          
          **Controls:**
          - Arrow keys: Move pieces
          - Up: Rotate, Space: Drop
          - R: Restart, S: Toggle music
          - Esc: Quit
        prerelease: ${{ github.ref_name != 'main' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
